<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
    <!-- media type e media feature -->
    <!-- Media types identificam o formato da mídia (ex: tela de desktop, tablet, mobile). 
    Media features determinam se as condições para aplicar as regras CSS são verdadeiras ou falsas (ex: tela modo retrato ou paisagem) -->
    <link rel="stylesheet" href="estilos/retrato.css" media="screen and (orientation: portrait)"> 
    <link rel="stylesheet" href="estilos/paisagem.css" media="screen and (orientation: landscape)">
    <link rel="stylesheet" href="estilos/style.css" media="all">
</head>
<body>
    <h1>Mude a orientação do seu dispositivo</h1>
</body>
</html>
