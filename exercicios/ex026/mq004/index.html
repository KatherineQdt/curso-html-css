<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
    <link rel="stylesheet" href="estilos/style.css" media="all">
    <link rel="stylesheet" href="estilos/mediaquery.css">

        Você pode criar folhas de estilo para tamanhos específicos de tela como no exemplo a abaixo:
        <link rel="stylesheet" href="estilos/style.css" media="screen and (max-width: 800px)">
    -->
</head>
<body>
    <main>
        <h1>Testando Media Queries</h1>
        <img id="phone" src="imagens/icon-phone.png" alt="Acessando via smarthphone">
        <img id="tablet" src="imagens/icon-tablet.png" alt="Acessando via tablet">
        <img id="print" src="imagens/icon-print.png" alt="Versão para impressão">
        <img id="pc" src="imagens/icon-pc.png" alt="Versão para Desktop">
        <img id="tv" src="imagens/icon-tv.png" alt="Versão para TV">
    </main>

</html>
