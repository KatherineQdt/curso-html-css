<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="iusu">Usuário: </label>
            <input type="text" name="usu" id="iusu" required minlength="5" maxlength="15" size="10" placeholder="nome do usuário" autocomplete="username">
            <!--
                ATRIBUTOS
                    required: torna o campo obrigatório
                    minlenght: quantidade minima de caracteres
                    maxlenght: quantidade máxima de caracteres
                    size: tamanho em caracteres do campo (tamanho de 10 caracteres). Não limita a quantidade digitada no campo, apenas limita o tamanho da caixa
                    placeholder: informação que aparece dentro da caixa. Não a preenche, mas fica no fundo informando qual dado a ser digitada ou exemplo de dado ou dica para o usuário
                    autocomplete: informa o tipo de dado. o navegador costuma armazenar informações do seu usuário, e na hora de preencher esse formulário ele pode oferecer sugestões de acordo com as informações que armazenou do seu usuario. Info extra: current-password indica senha atual e new-password indica uma nova senha (redefinição)
            -->
        </p>
        <p>
            <label for="isen">Senha: </label>
            <input type="password" name="sen" id="isen" required minlength="8" maxlength="20" size="8" placeholder="senha" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
